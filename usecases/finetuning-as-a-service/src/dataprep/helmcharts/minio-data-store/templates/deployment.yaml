apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minio.fullname" . }}
  labels:
    app: {{ include "minio.name" . }}
    chart: {{ include "minio.chart" . }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "minio.name" . }}
      release: {{ .Release.Name }}
  # One SeaweedFS master owns the data directory: never two pods at once.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/s3-config: {{ include (print $.Template.BasePath "/s3-config-secret.yaml") . | sha256sum }}
      labels:
        app: {{ include "minio.name" . }}
        release: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      # SeaweedFS in one process (master, volume, filer, S3 gateway). Only its
      # S3 API is used, on the port MinIO had, so the MinIO SDK in Data Prep
      # talks to it unchanged.
      - name: s3
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - server
        - -dir=/data
        - -ip.bind=0.0.0.0
        - -master.volumeSizeLimitMB={{ .Values.volumeSizeLimitMB }}
        - -volume.max=0
        - -s3
        - -s3.port=9000
        - -s3.config=/etc/seaweedfs/s3.json
        ports:
        - name: api
          containerPort: 9000
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: api
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: api
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: s3-config
          mountPath: /etc/seaweedfs
          readOnly: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "minio.fullname" . }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: tmp
        emptyDir: {}
      - name: s3-config
        secret:
          secretName: {{ include "minio.fullname" . }}-s3-config
