{{- if not .Values.auth.rootUser }}{{ fail "auth.rootUser is required" }}{{ end }}
{{- if not .Values.auth.rootPassword }}{{ fail "auth.rootPassword is required" }}{{ end }}
# S3 identity for Data Prep: full access to every bucket, as MinIO's root user had.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minio.fullname" . }}-s3-config
  labels:
    app: {{ include "minio.name" . }}
    chart: {{ include "minio.chart" . }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  s3.json: |
    {{- dict "identities" (list (dict "name" "dataprep" "credentials" (list (dict "accessKey" .Values.auth.rootUser "secretKey" .Values.auth.rootPassword)) "actions" (list "Admin" "Read" "Write" "List" "Tagging"))) | toJson | nindent 4 }}
