#
# What the API may do to serve fine-tuned models from the UI.
#
# It creates and removes KServe LLMInferenceServices in the inference
# namespace, and reads their pods and the serving profile to report progress.
# Namespaced to that namespace, so this grants nothing anywhere else in the
# cluster; KServe itself creates the Deployment and Service for each model.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "finetuning-service.serviceAccountName" . }}
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if and .Values.modelDeployment.enabled .Values.modelDeployment.rbac.create }}
---
# What the API needs to serve a model and trace it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "finetuning-service.fullname" . }}-model-deployer-client
  namespace: {{ .Values.modelDeployment.namespace }}
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
rules:
  # One LLMInferenceService per deployed model; patch records that the model is
  # registered with the gateway.
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices"]
    verbs: ["get", "list", "create", "delete", "patch"]
  # Progress comes from the model pod's init containers and its readiness.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # The serving profile the deploy publishes.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "finetuning-service.fullname" . }}-model-deployer-client
  namespace: {{ .Values.modelDeployment.namespace }}
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "finetuning-service.fullname" . }}-model-deployer-client
subjects:
  - kind: ServiceAccount
    name: {{ include "finetuning-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and .Values.gateway.enabled .Values.gateway.restartOnApply }}
---
# Restarting the gateway after a semantic-router change.
#
# Narrow on purpose: get and patch on Deployments in the gateway's namespace, and
# nothing else. It is needed because LiteLLM caches an auto-router in its process
# keyed by model name -- re-registering the entry does not rebuild it, and this
# build has no config-reload endpoint -- so a router change only takes effect when
# the gateway restarts.
#
# With this absent the API reports that the change was saved but is not yet live,
# rather than failing, so an operator can restart the gateway themselves.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "finetuning-service.fullname" . }}-gateway-restarter
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ .Values.gateway.deployment | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "finetuning-service.fullname" . }}-gateway-restarter
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "finetuning-service.fullname" . }}-gateway-restarter
subjects:
  - kind: ServiceAccount
    name: {{ include "finetuning-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.modelDeployment.capacity.enabled }}
---
# Reading how much room is left before deploying a model.
#
# This is the only cluster-scoped grant in the chart, and it exists because the
# question cannot be answered from one namespace: nodes are not namespaced, and
# the pods reserving capacity on them are spread across every namespace. Both
# verbs are read-only, and no other resource is included.
#
# The API treats a 403 here as "capacity unknown" rather than as an error, so
# turning this off (capacity.enabled=false) disables the pre-flight check and
# leaves deployment working exactly as it did before.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "finetuning-service.fullname" . }}-capacity-reader
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Cluster-wide, because a node's free capacity is its allocatable minus what
  # every pod on it has requested, whichever namespace those pods live in.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "finetuning-service.fullname" . }}-capacity-reader
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "finetuning-service.fullname" . }}-capacity-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "finetuning-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
