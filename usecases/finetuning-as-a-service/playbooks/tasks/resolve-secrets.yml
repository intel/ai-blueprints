---
###########################################################################
# Passwords and shared secrets of this use case.
#
# Each one is resolved in this order, and the first non-empty value wins:
#   1. finetune-config.cfg, when the operator set it;
#   2. the state Secret (finetune_state_secret) written by an earlier run;
#   3. a freshly generated value.
# The result is written back to the state Secret, so later runs always take
# step 2 and nothing is rotated by re-running. That matters most for the
# databases: Postgres reads its password only when it first initialises the
# volume, so a new password would lock each service out of its own data.
#
# To rotate one, delete its key from the state Secret AND update the
# component that holds the old value (for a database, ALTER USER first).
###########################################################################

- name: Define the Secrets This Use Case Owns
  set_fact:
    finetune_secret_spec:
      - var: dataprep_postgres_password
      - var: finetune_api_postgres_password
      - var: finetune_engine_postgres_password
      - var: finetune_minio_secret_key
      # Client the Fine-Tuning API uses (client_credentials) to call the engine.
      - var: nvidia_keycloak_client_secret
        config: nvidia_keycloak_client_secret
      # Browser client the platform gateway signs users in with.
      - var: oidc_client_secret
        config: oidc_client_secret
      # Signs the per-job token a training pod uses against the Data Prep files
      # API. Held by the Fine-Tuning API (signs) and Data Prep (verifies) only.
      - var: files_job_token_secret
        config: files_job_token_secret
        length: 48
      # Signs the UI's NextAuth session. Kept stable so a redeploy does not
      # sign everybody out.
      - var: finetune_nextauth_secret
        length: 32
  no_log: true

- name: Read the State Secret
  shell: >-
    kubectl -n {{ finetune_state_namespace }} get secret {{ finetune_state_secret }}
    -o jsonpath='{.data}' 2>/dev/null || true
  changed_when: false
  register: finetune_state_raw
  no_log: true

- name: Decode the State Secret
  set_fact:
    finetune_state: >-
      {%- set d = {} -%}
      {%- for k, v in (finetune_state_raw.stdout | default('', true) or '{}') | from_json | dictsort -%}
      {%-   set _ = d.update({k: v | b64decode}) -%}
      {%- endfor -%}
      {{ d | to_json }}
  no_log: true

- name: Resolve Every Secret
  set_fact:
    finetune_resolved_secrets: >-
      {%- set state = finetune_state | from_json -%}
      {%- set out = {} -%}
      {%- for s in finetune_secret_spec if (s.when | default(true)) | bool -%}
      {%-   set v = (finetune_config[s.config] | default('', true) if s.config is defined else '')
                    or state[s.var] | default('')
                    or lookup('password', '/dev/null chars=ascii_letters,digits length=' ~ (s.length | default(24))) -%}
      {%-   set _ = out.update({s.var: v}) -%}
      {%- endfor -%}
      {{ out | to_json }}
  no_log: true

- name: Expose Each Secret as a Variable
  set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ finetune_resolved_secrets | from_json | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Ensure the State Namespace Exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ finetune_state_namespace }}"
        labels: "{{ finetune_namespace_labels }}"

- name: Store the Secrets for Later Runs
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ finetune_state_secret }}"
        namespace: "{{ finetune_state_namespace }}"
        labels:
          app.kubernetes.io/part-of: finetuning-as-a-service
      type: Opaque
      stringData: "{{ finetune_resolved_secrets | from_json }}"
  no_log: true
